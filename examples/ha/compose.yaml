# Deploy this opt-in file separately on EACH of the two Docker hosts.
# Mount the SAME coherently locked filesystem at /srv/vessel-ha-data on both
# hosts. Create the data subdirectory on the shared filesystem after mounting.
services:
  vessel:
    image: ${VESSEL_HA_IMAGE:?Set the same reviewed immutable image on both hosts}
    restart: unless-stopped
    environment:
      VESSEL_HA_MODE: shared-storage
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - type: bind
        source: /srv/vessel-ha-data/vessel
        target: /data
        bind:
          create_host_path: false

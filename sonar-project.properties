sonar.externalIssuesReportPaths=reports/sonar/app-router-compliance.json

# Reviewed intentional root startup only, not blanket Dockerfile exclusions.
# Production requires existing /data permissions and host Docker/Podman sockets;
# the toolkit creates the host UID/GID/socket group before su drops privileges.
# Keep every other Docker rule enabled on these files.
sonar.issue.ignore.multicriteria=rootMain,rootLinux,rootAlpine,rootRelease,rootToolkit
sonar.issue.ignore.multicriteria.rootMain.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.rootMain.resourceKey=Dockerfile
sonar.issue.ignore.multicriteria.rootLinux.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.rootLinux.resourceKey=build/linux/Dockerfile
sonar.issue.ignore.multicriteria.rootAlpine.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.rootAlpine.resourceKey=build/linux/alpine.Dockerfile
sonar.issue.ignore.multicriteria.rootRelease.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.rootRelease.resourceKey=build/release-context.Dockerfile
sonar.issue.ignore.multicriteria.rootToolkit.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.rootToolkit.resourceKey=build/linux/dev-toolkit/toolkit.Dockerfile

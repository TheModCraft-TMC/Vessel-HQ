name: Vessel HQ bug report
description: Report a bug in Vessel HQ.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        # Report a Vessel HQ bug

        This tracker is for [Vessel HQ](https://github.com/TheModCraft-TMC/Vessel-HQ), TheModCraft's maintained Portainer Community Edition fork, not Portainer Business Edition.
        Please check the [README](https://github.com/TheModCraft-TMC/Vessel-HQ#readme) and [latest release](https://github.com/TheModCraft-TMC/Vessel-HQ/releases/latest) first.
        Do not include credentials, tokens, private infrastructure details, or unredacted environment files.
        Report security vulnerabilities using [SECURITY.md](https://github.com/TheModCraft-TMC/Vessel-HQ/blob/develop/SECURITY.md), not a public issue.

  - type: checkboxes
    id: terms
    attributes:
      label: Before you start
      options:
        - label: I've searched [Vessel HQ issues](https://github.com/TheModCraft-TMC/Vessel-HQ/issues) for this problem.
          required: true
        - label: I'm reporting a bug in Vessel HQ, not upstream Portainer or Portainer Business Edition.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead? Include any error message.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide enough detail for us to reproduce the bug.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Vessel HQ version
      description: Use the Vessel version shown in the UI or your exact image tag/commit, not the upstream API compatibility version (2.45.0).
      placeholder: e.g. 1.3.1 or a development commit SHA
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and Version
      description: Docker, Docker Swarm, Podman, Kubernetes, or Azure ACI, including version and connection type (socket, API, agent, or edge agent).
      placeholder: e.g. Docker 29.5.3 via local socket
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS and Architecture
      placeholder: e.g. Ubuntu 24.04, ARM64
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser name and version, if relevant.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Vessel HQ logs or screenshots
      description: Include relevant logs/screenshots. Redact credentials, tokens, private hostnames, and other sensitive information.
    validations:
      required: false

  - type: textarea
    id: deployment
    attributes:
      label: How did you deploy Vessel HQ?
      description: Include your image repository/tag and sanitized docker command, Compose file, Kubernetes manifest, or local development command. Remove secrets first.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Anything else that helps explain or reproduce the bug.
    validations:
      required: false

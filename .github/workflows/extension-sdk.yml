name: Extension host integration

on:
  pull_request:
    paths:
      - 'backend-src/api/nativeextensions/**'
      - 'backend-src/api/internal/extensiontest/**'
      - 'backend-src/api/http/handler/nativeextensions/**'
      - 'backend-src/go.mod'
      - 'backend-src/go.sum'
      - 'Makefile'
      - '.github/workflows/extension-sdk.yml'
      - '.github/workflows/backend-security.yml'
  push:
    branches: [main]
    paths:
      - 'backend-src/api/nativeextensions/**'
      - 'backend-src/api/internal/extensiontest/**'
      - 'backend-src/api/http/handler/nativeextensions/**'
      - 'backend-src/go.mod'
      - 'backend-src/go.sum'
      - 'Makefile'
      - '.github/workflows/extension-sdk.yml'
      - '.github/workflows/backend-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    uses: ./.github/workflows/backend-security.yml
  host-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend-src/go.mod
          cache-dependency-path: backend-src/go.sum
      - name: Test host against the pinned published SDK
        env:
          GOWORK: 'off'
        run: make test-extension-host

name: Build Linux image

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      verify_only:
        description: Run frontend validation and production build without publishing anything
        required: false
        default: false
        type: boolean
      version_tag:
        description: Release version (blank uses RELEASE_VERSION; must match it)
        required: false
        type: string
      reissue_ui_digest:
        description: Original 1.3.2 digest for the authorized sidebar/statistics repair only
        required: false
        type: string
      mirror_source_digest:
        description: Mirror an already validated beta index from GHCR without rebuilding (sha256 digest)
        required: false
        type: string
      compose_unpacker_tag:
        description: Compose unpacker image version tag
        required: true
        default: '2.39.3.2.3'
        type: string

env:
  IMAGE_NAME: themodcrafttmc/vessel-hq
  UNPACKER_IMAGE_NAME: themodcrafttmc/compose-unpacker
  DEFAULT_COMPOSE_UNPACKER_TAG: '2.39.3.2.3'

concurrency:
  # Keep untrusted PR checks isolated from the serialized publication queue.
  group: linux-image-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux-image:
    name: Validate, build, and publish Linux image
    if: inputs.mirror_source_digest == '' && !inputs.verify_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve release version
        id: image
        env:
          REQUESTED_VERSION: ${{ inputs.version_tag }}
          COMPOSE_UNPACKER_TAG: ${{ inputs.compose_unpacker_tag }}
        run: |
          version_tag=$(bash scripts/check-release-version.sh "$REQUESTED_VERSION")
          compose_unpacker_tag=${COMPOSE_UNPACKER_TAG:-$DEFAULT_COMPOSE_UNPACKER_TAG}
          [[ "$compose_unpacker_tag" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          echo "version_tag=$version_tag" >> "$GITHUB_OUTPUT"
          echo "compose_unpacker_tag=$compose_unpacker_tag" >> "$GITHUB_OUTPUT"
          channel_tag=latest
          if [[ "$version_tag" == *-beta.* ]]; then
            channel_tag=beta
          fi
          echo "channel_tag=$channel_tag" >> "$GITHUB_OUTPUT"

      - name: Require an unused immutable tag
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
        env:
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          REISSUE_UI_DIGEST: ${{ inputs.reissue_ui_digest }}
        run: |
          status=$(curl --silent --show-error --retry 3 --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/release-tag.json" --write-out '%{http_code}' \
            "https://hub.docker.com/v2/repositories/$IMAGE_NAME/tags/$VERSION_TAG")
          if [[ -n "$REISSUE_UI_DIGEST" ]]; then
            [[ "$VERSION_TAG" == 1.3.2 && "$REISSUE_UI_DIGEST" == sha256:da06e29cafd61278ff86ef4a25b600199e5e914f085066e848ab2eee64999014 ]]
            [[ "$status" == 200 ]]
            jq -e --arg digest "$REISSUE_UI_DIGEST" '.digest == $digest' "$RUNNER_TEMP/release-tag.json"
          elif [[ "$status" != 404 ]]; then
            echo "Refusing to publish $IMAGE_NAME:$VERSION_TAG: tag lookup returned HTTP $status (expected 404)." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.26.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend-src/go.mod
          cache-dependency-path: backend-src/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check recorded npm security regressions
        run: pnpm check:npm-security
      - name: Check fresh npm advisories (moderate or higher blocks)
        run: pnpm check:npm-security:fresh
      - name: Retain fresh npm advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-advisory-report-${{ github.job }}
          path: dist/security/npm-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate release and frontend
        run: |
          bash scripts/check-release-version.test.sh
          node --test build/*.test.cjs scripts/*.test.mjs
          pnpm check:npm-security
          pnpm check:frontend-modernization
          pnpm check:frontend-boundaries
          pnpm check:app-router-compliance
          pnpm check:css-module-classes
          bash scripts/publish-release-mirrors.test.sh
          bash scripts/reissue-ui-1.3.2.test.sh
          pnpm typecheck
          pnpm lint:ci
          pnpm test
          pnpm storybook:build --disable-telemetry

      - name: Test integration harness safety
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/integration -p 'test_*.py'
          node --check scripts/integration/oauth_browser.cjs

      - name: Test backend
        working-directory: backend-src
        run: go test ./...

      - name: Build release context
        env:
          BUILDNUMBER: ${{ github.run_number }}
          GIT_COMMIT_HASH: ${{ github.sha }}
        run: ./scripts/build-release-context.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Execute-check both platform images
        env:
          COMPOSE_UNPACKER_TAG: ${{ steps.image.outputs.compose_unpacker_tag }}
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --build-arg "COMPOSE_UNPACKER_IMAGE=$UNPACKER_IMAGE_NAME:$COMPOSE_UNPACKER_TAG" \
              -t "vessel-release-check:$arch" dist/release-context
            docker run --rm --platform "linux/$arch" "vessel-release-check:$arch" --version
          done

      - name: Login to Docker Hub
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install registry copier
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Set build date
        id: date
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Archive original UI build before the authorized reissue
        if: github.event_name == 'workflow_dispatch' && inputs.reissue_ui_digest != ''
        env:
          VERSION: ${{ steps.image.outputs.version_tag }}
          PREVIOUS: ${{ inputs.reissue_ui_digest }}
        run: bash scripts/reissue-ui-1.3.2.sh archive "$VERSION" "$PREVIOUS"

      - name: Publish immutable image
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: dist/release-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.version_tag }}
          build-args: |
            RELEASE_VERSION=${{ steps.image.outputs.version_tag }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.created }}
            COMPOSE_UNPACKER_IMAGE=${{ env.UNPACKER_IMAGE_NAME }}:${{ steps.image.outputs.compose_unpacker_tag }}

      - name: Repair the existing mirror for the authorized UI reissue
        if: github.event_name == 'workflow_dispatch' && inputs.reissue_ui_digest != ''
        env:
          VERSION: ${{ steps.image.outputs.version_tag }}
          PREVIOUS: ${{ inputs.reissue_ui_digest }}
          REPLACEMENT: ${{ steps.publish.outputs.digest }}
        run: bash scripts/reissue-ui-1.3.2.sh mirror "$VERSION" "$PREVIOUS" "$REPLACEMENT"

      - name: Verify immutable image and promote channel
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
        env:
          VERSION_TAG: ${{ steps.image.outputs.version_tag }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          CHANNEL_TAG: ${{ steps.image.outputs.channel_tag }}
        run: |
          bash scripts/publish-release-mirrors.sh "docker.io/$IMAGE_NAME" "$VERSION_TAG" "$IMAGE_DIGEST" \
            "docker.io/$IMAGE_NAME" ghcr.io/themodcraft-tmc/vessel-hq

  mirror-validated-beta:
    name: Mirror validated beta without rebuilding
    if: github.event_name == 'workflow_dispatch' && inputs.mirror_source_digest != '' && !inputs.verify_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check mirror failure handling
        run: bash scripts/publish-release-mirrors.test.sh
      - name: Require a successful canonical tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version_tag }}
          DIGEST: ${{ inputs.mirror_source_digest }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,}-beta\.[1-9][0-9]*$ ]]
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          commit=$(git rev-parse "refs/tags/v$VERSION^{commit}")
          gh run list --repo TheModCraft-TMC/Vessel-HQ --workflow native-extension-prerelease.yml \
            --commit "$commit" --status success --json headBranch,event,conclusion \
            | jq -e --arg tag "v$VERSION" 'any(.[]; .headBranch == $tag and .event == "push" and .conclusion == "success")'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install registry copier
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Copy all platform manifests and blobs, preserving the index digest
        env:
          VERSION: ${{ inputs.version_tag }}
          DIGEST: ${{ inputs.mirror_source_digest }}
        run: |
          bash scripts/publish-release-mirrors.sh ghcr.io/themodcraft-tmc/vessel-hq "$VERSION" "$DIGEST" \
            docker.io/themodcrafttmc/vessel-hq
          printf 'docker.io/themodcrafttmc/vessel-hq:%s@%s\n' "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  verify-frontend:
    name: Verify frontend without publishing
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Check recorded npm security regressions
        run: pnpm check:npm-security
      - name: Check fresh npm advisories (moderate or higher blocks)
        run: pnpm check:npm-security:fresh
      - name: Retain fresh npm advisory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-advisory-report-${{ github.job }}
          path: dist/security/npm-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Check architecture and types
        run: |
          pnpm check:frontend-modernization
          pnpm check:frontend-boundaries
          pnpm check:app-router-compliance
          pnpm typecheck
      - name: Test extensions and frontend
        run: |
          pnpm test:extensions --maxWorkers=4
          pnpm test --maxWorkers=4
      - name: Lint frontend
        run: pnpm lint:ci
      - name: Build production frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm build
